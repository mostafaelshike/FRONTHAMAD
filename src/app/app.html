<div class="app-toast-container" aria-live="polite" aria-relevant="additions text">
	@for (toast of toastService.messages(); track toast.id) {
		<div class="app-toast app-toast--{{ toast.type }}" [attr.role]="toast.type === 'error' ? 'alert' : 'status'" aria-atomic="true">
			<div class="app-toast__icon">
				@if (toast.type === 'success') {
					<i class="bi bi-check-circle-fill"></i>
				} @else if (toast.type === 'error') {
					<i class="bi bi-x-circle-fill"></i>
				} @else {
					<i class="bi bi-info-circle-fill"></i>
				}
			</div>

			<span class="app-toast__text">{{ toast.text }}</span>

			<button type="button" class="app-toast__close" (click)="toastService.dismiss(toast.id)" aria-label="إغلاق التنبيه">
				<i class="bi bi-x-lg"></i>
			</button>
			<span class="app-toast__progress" [style.animation-duration.ms]="toast.duration"></span>
		</div>
	}
</div>
